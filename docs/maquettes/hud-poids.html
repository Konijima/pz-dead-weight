<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Weight Scale - maquette HUD poids</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dial.css">
<link rel="stylesheet" href="css/beam.css">
<link rel="stylesheet" href="css/native.css">
</head>
<body>
<header class="page-head">
  <h1>Weight Scale - HUD poids (maquette, 3 directions)</h1>
  <p class="page-sub">Cadre 1920x1080. Le joueur est au centre de l'ecran. Le lecteur de poids
  apparait en haut a droite du centre quand le joueur est debout sur la tuile de la balance
  medicale, et disparait quand il en descend.</p>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-dir="dial">A. Cadran diegetique</button>
  <button class="tab-btn" data-dir="beam">B. Fleau a curseur</button>
  <button class="tab-btn" data-dir="native">C. Panneau natif minimal</button>
</nav>

<section class="controls">
  <button id="btn-appear">Apparition</button>
  <button id="btn-settle">Stabilisation</button>
  <button id="btn-unit">Changer unite (kg/lb)</button>
  <button id="btn-leave">Depart</button>
  <button id="btn-reset">Reinitialiser</button>
  <label class="weight-slider">Poids demo (kg)
    <input type="range" id="weight-range" min="35" max="130" value="80" step="1">
    <span id="weight-value">80</span>
  </label>
</section>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="scene">
      <div class="scale-tile"></div>
      <div class="char-shadow"></div>
      <div class="character"></div>
    </div>
    <div class="readout-mount" id="mount-dial"></div>
    <div class="readout-mount" id="mount-beam"></div>
    <div class="readout-mount" id="mount-native"></div>
  </div>
</div>

<section class="filmstrips" id="filmstrips"></section>

<section class="specs" id="specs"></section>

<script src="js/templates.js"></script>
<script src="js/filmstrips.js"></script>
<script src="js/specs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
